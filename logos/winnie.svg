<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="30" fill="#2a1f00" stroke="#FFD700" stroke-width="2.5"/>
  
  <!-- Bear head -->
  <ellipse cx="30" cy="35" rx="16" ry="15" fill="#FFD700"/>
  
  <!-- Ears -->
  <circle cx="16" cy="22" r="6.5" fill="#FFD700"/>
  <circle cx="16" cy="22" r="3.5" fill="#e6b800"/>
  <circle cx="44" cy="22" r="6.5" fill="#FFD700"/>
  <circle cx="44" cy="22" r="3.5" fill="#e6b800"/>
  
  <!-- Eyes - small beady Pooh-style -->
  <circle cx="24" cy="31" r="3" fill="#2a1f00"/>
  <circle cx="36" cy="31" r="3" fill="#2a1f00"/>
  <circle cx="25" cy="30" r="1" fill="white"/>
  <circle cx="37" cy="30" r="1" fill="white"/>
  
  <!-- Snout - round soft -->
  <ellipse cx="30" cy="39" rx="8" ry="6" fill="#e6b800"/>
  <ellipse cx="30" cy="37" rx="3" ry="2" fill="#2a1f00"/>
  <!-- Little smile -->
  <path d="M26 41 Q30 45 34 41" fill="none" stroke="#2a1f00" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Honey drip on forehead - simple detail -->
  <path d="M30 21 Q31 25 29 27" fill="none" stroke="#ff9900" stroke-width="2" stroke-linecap="round"/>
  <circle cx="29" cy="27.5" r="1.5" fill="#ff9900"/>
  
  <!-- HONEY POT in bottom-right corner -->
  <g transform="translate(43,43)">
    <!-- Pot body -->
    <ellipse cx="0" cy="4" rx="8" ry="9" fill="#cc7700"/>
    <rect x="-7" y="-1" width="14" height="9" fill="#cc7700"/>
    <ellipse cx="0" cy="-1" rx="7" ry="3" fill="#e8a020"/>
    <!-- Pot lip/rim -->
    <rect x="-8" y="-3" width="16" height="3" rx="1.5" fill="#e8a020"/>
    <!-- Honey inside -->
    <ellipse cx="0" cy="-1" rx="5.5" ry="2" fill="#FFD700"/>
    <!-- Honey drip -->
    <path d="M3 -1 Q4 3 3 5" stroke="#FFD700" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Label -->
    <text x="0" y="7" text-anchor="middle" font-size="5" font-weight="bold" fill="#FFD700" font-family="serif">H</text>
  </g>
</svg>
