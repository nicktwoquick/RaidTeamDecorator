<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="30" fill="#1e2d3d" stroke="#4682B4" stroke-width="2.5"/>
  
  <!-- Big round relaxed bear head -->
  <ellipse cx="32" cy="36" rx="20" ry="18" fill="#4682B4"/>
  
  <!-- Ears - big and round -->
  <circle cx="14" cy="20" r="8" fill="#4682B4"/>
  <circle cx="14" cy="20" r="4.5" fill="#3570a0"/>
  <circle cx="50" cy="20" r="8" fill="#4682B4"/>
  <circle cx="50" cy="20" r="4.5" fill="#3570a0"/>
  
  <!-- Snout - big puffy -->
  <ellipse cx="32" cy="42" rx="12" ry="9" fill="#5a9fd4"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="37" rx="4.5" ry="3" fill="#1e2d3d"/>
  
  <!-- Big happy eyes - half closed/relaxed -->
  <ellipse cx="24" cy="32" rx="4" ry="4" fill="#1e2d3d"/>
  <ellipse cx="40" cy="32" rx="4" ry="4" fill="#1e2d3d"/>
  <!-- Happy squint lines over eyes -->
  <path d="M20 30 Q24 27 28 30" fill="#4682B4" stroke="none"/>
  <path d="M36 30 Q40 27 44 30" fill="#4682B4" stroke="none"/>
  <!-- Eye shine -->
  <circle cx="25.5" cy="31" r="1.2" fill="white"/>
  <circle cx="41.5" cy="31" r="1.2" fill="white"/>
  
  <!-- Big wide smile -->
  <path d="M22 44 Q32 54 42 44" fill="none" stroke="#1e2d3d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Visible teeth - grinning -->
  <path d="M22 44 Q32 52 42 44 Q38 46 32 46 Q26 46 22 44 Z" fill="white"/>
  
  <!-- Chubby cheeks blush -->
  <circle cx="20" cy="40" r="4" fill="#6aa8d8" opacity="0.5"/>
  <circle cx="44" cy="40" r="4" fill="#6aa8d8" opacity="0.5"/>
</svg>
