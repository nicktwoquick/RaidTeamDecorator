<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="30" fill="#1a0000" stroke="#FF0000" stroke-width="2.5"/>

  <!-- Starburst / explosion shape - 16 points alternating big/small -->
  <polygon points="
    32,4   35,22  40,8   40,24  50,13  45,27  60,24  50,32
    60,40  45,37  50,51  40,40  40,56  35,42  32,60  29,42
    24,56  24,40  14,51  19,37  4,40   14,32  4,24   19,27
    14,13  24,24  24,8   29,22
  " fill="#FF0000"/>

  <!-- Inner circle to clean up center for text -->
  <circle cx="32" cy="32" r="16" fill="#cc0000"/>

  <!-- Subtle inner ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ff4444" stroke-width="1"/>

  <!-- FLEX text -->
  <text x="32" y="36.5"
    text-anchor="middle"
    font-size="12"
    font-weight="900"
    font-family="Impact, Arial Black, sans-serif"
    letter-spacing="0.5"
    fill="white">FLEX</text>
</svg>
