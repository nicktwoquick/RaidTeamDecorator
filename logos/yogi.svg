<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="30" fill="#0d200d" stroke="#32CD32" stroke-width="2.5"/>
  
  <!-- Bear head -->
  <ellipse cx="32" cy="33" rx="17" ry="16" fill="#7a5c2e"/>
  
  <!-- Ears -->
  <circle cx="17" cy="19" r="6.5" fill="#7a5c2e"/>
  <circle cx="17" cy="19" r="3.5" fill="#5e4422"/>
  <circle cx="47" cy="19" r="6.5" fill="#7a5c2e"/>
  <circle cx="47" cy="19" r="3.5" fill="#5e4422"/>
  
  <!-- Face lighter area -->
  <ellipse cx="32" cy="36" rx="11" ry="10" fill="#9a7840"/>
  
  <!-- Eyes - Yogi style, confident look -->
  <circle cx="26" cy="28" r="3.5" fill="white"/>
  <circle cx="38" cy="28" r="3.5" fill="white"/>
  <circle cx="27" cy="29" r="2" fill="#2a1505"/>
  <circle cx="39" cy="29" r="2" fill="#2a1505"/>
  <circle cx="27.5" cy="28.5" r="0.7" fill="white"/>
  <circle cx="39.5" cy="28.5" r="0.7" fill="white"/>
  
  <!-- Brow/brow ridge - Yogi smug look -->
  <path d="M22 25 Q26 22 30 25" fill="none" stroke="#5e4422" stroke-width="2" stroke-linecap="round"/>
  <path d="M34 25 Q38 22 42 25" fill="none" stroke="#5e4422" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="34" rx="3.5" ry="2.5" fill="#2a1505"/>
  
  <!-- Smirk smile -->
  <path d="M28 38 Q32 43 38 40" fill="none" stroke="#2a1505" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- COLLAR - the key feature, sharp horizontal line -->
  <rect x="12" y="47" width="40" height="6" rx="2" fill="white" stroke="#cccccc" stroke-width="0.5"/>
  <!-- Collar overlap/lapels -->
  <polygon points="32,47 26,47 29,53" fill="#e8e8e8"/>
  <polygon points="32,47 38,47 35,53" fill="#e8e8e8"/>
  
  <!-- TIE - lime green -->
  <polygon points="32,48 29,50 32,58 35,50" fill="#32CD32"/>
  <polygon points="29,50 35,50 32,53" fill="#228B22"/>
  <!-- Tie knot -->
  <ellipse cx="32" cy="49" rx="3" ry="2" fill="#28b428"/>
  
  <!-- Hat brim - Yogi's hat (small) -->
  <rect x="20" y="12" width="24" height="10" rx="2" fill="#32CD32"/>
  <rect x="17" y="20" width="30" height="3" rx="1.5" fill="#228B22"/>
  <!-- Hat band -->
  <rect x="20" y="18" width="24" height="3" fill="#1a7a1a"/>
</svg>
