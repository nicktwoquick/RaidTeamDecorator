name: 'Create release'
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate conventional commits since v1.0.0
        env:
          BASELINE_TAG: v1.0.0
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "${BASELINE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "::error::Baseline tag ${BASELINE_TAG} not found. Fetch tags or create the tag before releasing."
            exit 1
          fi
          # commitlint excludes --from and includes --to (same semantics as PR base..head in commitlint docs)
          npm exec --yes --package=@commitlint/cli --package=@commitlint/config-conventional -- \
            commitlint \
              --from="${BASELINE_TAG}" \
              --to=HEAD \
              --verbose \
              --extends @commitlint/config-conventional
      - name: Convert logos from SVG to TGA
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          cd logos
          for f in *.svg; do
            convert -background none -alpha on "$f" -flip -define tga:bits-per-pixel=32 "${f%.svg}.tga"
          done
          rm *.svg
      - name: Stage generated TGA files
        run: git add -f logos/
      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -g bcc -w 0
